defaults:
  - urbanmarl_uavmec_offloading_config
  - _self_

num_uavs: 3
num_ues: 50
max_time_slots: 100
volume_size: [500, 500, 200]
max_horizontal_speed: 49.0
max_vertical_speed: 12.0
max_transmit_power: 5.0
frequency_ghz: 29.0
g2a_bandwidth: 10000000.0
noise_figure_db: 7.0

# MEC task workload and computing configuration
