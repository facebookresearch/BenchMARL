task_data_size_min: 500000.0
task_data_size_max: 2000000.0
cpu_cycles_per_bit: 1000.0
max_latency_deadline: 1.0
ue_tx_power: 0.5
uav_cpu_freq: 20000000000.0
uav_num_cores: 4
distance_weight: 0.7

# Multi-objective reward weights
w_tasks: 1.0
w_latency: 0.5
w_energy: 0.1
w_collision: 2.0
w_sojourn: 0.3
extended_mec_obs: true
